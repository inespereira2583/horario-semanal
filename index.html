<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Horário do Ginásio</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .hidden {
            display: none !important;
        }

        /* Estilos do Login */
        .auth-form {
            max-width: 400px;
            margin: 40px auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Estilos da Tabela de Horários */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
        }

        .error-message {
            color: var(--danger);
            margin-top: 10px;
            font-size: 0.9em;
        }

        .status-badge {
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 4px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Ecrã de Login -->
    <div id="auth-screen" class="card auth-form">
        <h2>Área Reservada</h2>
        <p>Inicie sessão para visualizar e editar o horário do ginásio.</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" style="width: 100%;">Entrar</button>
            <div id="auth-error" class="error-message"></div>
        </form>
    </div>

    <!-- Painel de Horários (Visível apenas após Login) -->
    <div id="app-screen" class="card hidden">
        <div class="header-bar">
            <h2>Horário de Aulas</h2>
            <div>
                <span id="user-email" class="status-badge"></span>
                <button id="btn-logout" class="btn-danger" style="margin-left: 10px;">Sair</button>
            </div>
        </div>

        <!-- Formulário para adicionar/editar horários -->
        <form id="schedule-form" style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="slot-day" placeholder="Dia (Ex: Segunda)" required>
            <input type="text" id="slot-time" placeholder="Hora (Ex: 18:00)" required>
            <input type="text" id="slot-class" placeholder="Aula (Ex: CrossFit)" required>
            <button type="submit">Guardar</button>
        </form>

        <!-- Tabela de Horários Sincronizada -->
        <table>
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Hora</th>
                    <th>Aula</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="schedule-table-body">
                <tr>
                    <td colspan="4" style="text-align: center;">A carregar horários...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Firebase SDK v10/v11 via CDN (ES Modules) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        deleteDoc, 
        doc, 
        onSnapshot, 
        query 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Credenciais do seu projeto Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBLTxgJByKEOZeB3IQ1SGFFC9kw5OjdDG4",
        authDomain: "horario-semanal-2f655.firebaseapp.com",
        projectId: "horario-semanal-2f655",
        storageBucket: "horario-semanal-2f655.firebasestorage.app",
        messagingSenderId: "657949423982",
        appId: "1:657949423982:web:136f000ab39dbd229be97f",
        measurementId: "G-EY122F3W88"
    };

    // Inicialização
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Referências do DOM
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');
    const userEmailSpan = document.getElementById('user-email');
    const btnLogout = document.getElementById('btn-logout');
    const scheduleForm = document.getElementById('schedule-form');
    const scheduleTableBody = document.getElementById('schedule-table-body');

    let unsubscribeSnapshot = null;

    // Estado da Autenticação
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            userEmailSpan.textContent = user.email;
            setupRealtimeSchedule();
        } else {
            authScreen.classList.remove('hidden');
            appScreen.classList.add('hidden');
            userEmailSpan.textContent = '';
            
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                unsubscribeSnapshot = null;
            }
        }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authError.textContent = '';
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            loginForm.reset();
        } catch (error) {
            authError.textContent = "Erro ao iniciar sessão: " + getErrorMessage(error.code);
        }
    });

    // Logout
    btnLogout.addEventListener('click', () => {
        signOut(auth);
    });

    // Escuta em tempo real da Firestore
    function setupRealtimeSchedule() {
        const scheduleRef = collection(db, "horarios");
        const q = query(scheduleRef);

        unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
            scheduleTableBody.innerHTML = '';

            if (snapshot.empty) {
                scheduleTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Nenhum horário registado.</td></tr>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${escapeHtml(data.dia)}</td>
                    <td>${escapeHtml(data.hora)}</td>
                    <td>${escapeHtml(data.aula)}</td>
                    <td>
                        <button class="btn-danger btn-delete" data-id="${docSnap.id}">Eliminar</button>
                    </td>
                `;
                
                scheduleTableBody.appendChild(tr);
            });

            document.querySelectorAll('.btn-delete').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    try {
                        await deleteDoc(doc(db, "horarios", id));
                    } catch (err) {
                        alert("Erro ao eliminar aula: " + err.message);
                    }
                });
            });
        }, (error) => {
            console.error("Erro ao carregar dados:", error);
            scheduleTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Erro ao carregar dados do Firestore. Verificar Regras de Segurança.</td></tr>';
        });
    }

    // Adicionar Novo Horário
    scheduleForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const dayInput = document.getElementById('slot-day');
        const timeInput = document.getElementById('slot-time');
        const classInput = document.getElementById('slot-class');

        try {
            await addDoc(collection(db, "horarios"), {
                dia: dayInput.value,
                hora: timeInput.value,
                aula: classInput.value,
                criadoEm: new Date()
            });

            scheduleForm.reset();
        } catch (error) {
            alert("Erro ao guardar horário: " + error.message);
        }
    });

    // Auxiliares
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getErrorMessage(code) {
        switch (code) {
            case 'auth/invalid-credential':
            case 'auth/user-not-found':
            case 'auth/wrong-password':
                return 'E-mail ou palavra-passe incorretos.';
            case 'auth/invalid-email':
                return 'Formato de e-mail inválido.';
            default:
                return 'Não foi possível autenticar. Tente novamente.';
        }
    }
</script>
</body>
</html>
