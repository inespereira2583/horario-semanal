<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Horários — Ginásio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101014;
    --surface: #1a1a21;
    --surface-2: #22222b;
    --line: #2e2e38;
    --text: #eceef1;
    --text-dim: #9a9aa5;
    --accent: #D4FF3F;
    --accent-dim: #8fb52a;
    --danger: #ff6f6f;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:0.03em;font-weight:400;margin:0;}
  
  #auth-screen{
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  }
  .auth-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:32px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .auth-card h2{font-size:36px;color:var(--accent);margin-bottom:8px;text-align:center;}
  .auth-card p{color:var(--text-dim);font-size:14px;margin-bottom:24px;text-align:center;}

  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
    padding:24px 16px;display:flex;flex-direction:column;gap:6px;
  }
  .brand{margin-bottom:20px;}
  .brand h1{font-size:26px;color:var(--accent);line-height:1;}
  .brand span{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.15em;margin-top:4px;}
  .nav-btn{
    background:transparent;border:none;color:var(--text-dim);text-align:left;padding:11px 12px;border-radius:8px;
    font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--accent);color:#101014;}
  .nav-btn.logout{margin-top:auto;color:var(--danger);}
  .content{flex:1;padding:28px 32px;max-width:1200px;}
  .view{display:none;}
  .view.active{display:block;}
  .view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .view-head h2{font-size:32px;}
  .btn{
    background:var(--accent);color:#101014;border:none;padding:10px 16px;border-radius:8px;font-weight:700;
    font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;width:100%;text-align:center;
  }
  .btn:hover{background:var(--accent-dim);}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.small{padding:6px 10px;font-size:12px;width:auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .card-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .empty-state{color:var(--text-dim);font-size:13px;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;text-transform:uppercase;}
  input[type=text],input[type=password],input[type=email],input[type=number],input[type=time],input[type=week],select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:9px 10px;
    border-radius:7px;font-size:14px;font-family:inherit;
  }
  .field{margin-bottom:12px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .pt-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:22px;margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .avail-day{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;}
  .avail-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .avail-win{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:9px;
    font-size:13px;z-index:200;transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.toast-ok{border-color:var(--accent-dim);}
  .toast.toast-error{border-color:var(--danger);color:#ffd6d6;}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <h2>PLANNER</h2>
    <p>Inicia sessão para aceder ao sistema</p>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="exemplo@ginasio.com">
      </div>
      <div class="field">
        <label>Palavra-passe</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="btn-login" style="margin-top:12px;">Entrar</button>
      <div id="login-error" style="color:var(--danger);font-size:12px;margin-top:12px;text-align:center;"></div>
    </form>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand"><h1>PLANNER</h1><span>Ginásio</span></div>
    <button class="nav-btn active" data-view="ginasio">🏋 Ginásio</button>
    <button class="nav-btn" data-view="pts">👤 PTs</button>
    <button class="nav-btn" data-view="alunos">📋 Alunos</button>
    <button class="nav-btn logout" id="btn-logout">🚪 Sair</button>
  </aside>
  <main class="content">

    <section class="view active" id="view-ginasio">
      <div class="view-head"><h2>Horário do Ginásio</h2></div>
      <div class="card">
        <div class="field" style="max-width:220px;">
          <label>Duração da sessão (min)</label>
          <input type="number" id="ginasio-duracao" value="60">
        </div>
        <button class="btn small" id="btn-save-ginasio">Guardar</button>
      </div>
    </section>

    <section class="view" id="view-pts">
      <div class="view-head">
        <h2>Personal Trainers</h2>
        <button class="btn small" id="btn-add-pt">+ Novo PT</button>
      </div>
      <div id="pts-list"></div>
    </section>

    <section class="view" id="view-alunos">
      <div class="view-head">
        <h2>Alunos</h2>
        <button class="btn small" id="btn-add-aluno">+ Novo Aluno</button>
      </div>
      <div id="alunos-list"></div>
    </section>

  </main>
</div>
<div id="modal-root"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // SUBSTITUI ESTES DADOS PELOS TEUS DADOS REAIS DO FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyBLTxgJByKEOZeB3IQ1SGFFC9kw5OjdDG4",
  authDomain: "horario-semanal-2f655.firebaseapp.com",
  projectId: "horario-semanal-2f655",
  storageBucket: "horario-semanal-2f655.firebasestorage.app",
  messagingSenderId: "657949423982",
  appId: "1:657949423982:web:136f000ab39dbd229be97f",
  measurementId: "G-EY122F3W88"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const DIAS = [{key:'seg',label:'Segunda'},{key:'ter',label:'Terça'},{key:'qua',label:'Quarta'},{key:'qui',label:'Quinta'},{key:'sex',label:'Sexta'},{key:'sab',label:'Sábado'},{key:'dom',label:'Domingo'}];
  const PT_COLORS = ['#D4FF3F','#3FE0C5','#FF6F59','#8C7CF0','#FFB020','#4FC3F7'];
  let state = { config: { sessionDuration: 60 }, pts: [], alunos: [] };
  let unsubscribeSnapshot = null;

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function showToast(msg, ok=true){
    const el = document.createElement('div');
    el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-error');
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 3000);
  }

  // --- GUARDA E RECURSOS DO FIREBASE ---
  async function saveStateToFirebase(){
    try {
      await setDoc(doc(db, "ginasio_data", "geral"), state);
      return { ok: true };
    } catch(e) {
      console.error("Erro ao guardar:", e);
      return { ok: false };
    }
  }

  function subscribeToFirebase(){
    unsubscribeSnapshot = onSnapshot(doc(db, "ginasio_data", "geral"), (docSnap) => {
      if(docSnap.exists()){
        state = Object.assign({config:{sessionDuration:60},pts:[],alunos:[]}, docSnap.data());
        renderPts(); renderAlunos();
      } else {
        saveStateToFirebase();
      }
    }, (error) => {
      console.error("Erro no Listener:", error);
      showToast("Erro ao sincronizar dados. Verifica as Regras do Firebase.", false);
    });
  }

  // --- FORÇAR AUTENTICAÇÃO LIMPA ---
  // Bloqueia persistência longa e força logout inicial
  setPersistence(auth, browserSessionPersistence);
  
  // Força que ao abrir o link o utilizador comece fora da sessão
  window.addEventListener('DOMContentLoaded', () => {
    signOut(auth);
  });

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(err) {
      errorEl.textContent = 'Falha no login: Email ou Palavra-passe errados.';
    }
  });

  document.getElementById('btn-logout').addEventListener('click', ()=>{
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if(user){
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').classList.add('active');
      subscribeToFirebase();
    } else {
      if(unsubscribeSnapshot) unsubscribeSnapshot();
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app').classList.remove('active');
    }
  });

  // --- NAV ---
  document.querySelectorAll('.nav-btn[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-'+btn.dataset.view).classList.add('active');
    });
  });

  // --- MODAL ---
  function openModal(html, onMount){
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal">${html}</div></div>`;
    document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
    if(onMount) onMount(root);
  }
  function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

  // --- VISTAS ---
  document.getElementById('btn-save-ginasio').addEventListener('click', async ()=>{
    state.config.sessionDuration = Number(document.getElementById('ginasio-duracao').value)||60;
    const res = await saveStateToFirebase();
    showToast(res.ok ? 'Definições guardadas' : 'Erro ao guardar no Firebase', res.ok);
  });

  function renderPts(){
    const el = document.getElementById('pts-list');
    if(state.pts.length===0){ el.innerHTML = `<div class="empty-state">Sem PTs registados.</div>`; return; }
    el.innerHTML = state.pts.map((pt,i)=>`
      <div class="card">
        <div class="card-row">
          <div><span class="pt-dot" style="background:${PT_COLORS[i%PT_COLORS.length]}"></span> <b>${pt.nome}</b> (${pt.capacidade} alunos/sessão)</div>
          <button class="btn danger small" data-del-pt="${pt.id}">Remover</button>
        </div>
      </div>
    `).join('');
    el.querySelectorAll('[data-del-pt]').forEach(b=>b.addEventListener('click', async ()=>{
      state.pts = state.pts.filter(p=>p.id!==b.dataset.delPt);
      await saveStateToFirebase(); renderPts();
    }));
  }

  document.getElementById('btn-add-pt').addEventListener('click', ()=>{
    openModal(`
      <h3>Novo PT</h3>
      <div class="field"><label>Nome</label><input type="text" id="m-nome"></div>
      <div class="field"><label>Capacidade (Alunos/sessão)</label><input type="number" id="m-cap" value="1"></div>
      <div class="modal-actions">
        <button class="btn secondary small" id="m-cancel">Cancelar</button>
        <button class="btn small" id="m-save">Guardar</button>
      </div>
    `, (root)=>{
      root.querySelector('#m-cancel').addEventListener('click', closeModal);
      root.querySelector('#m-save').addEventListener('click', async ()=>{
        const nome = root.querySelector('#m-nome').value.trim();
        if(!nome) return;
        state.pts.push({ id: uid(), nome, capacidade: Number(root.querySelector('#m-cap').value)||1 });
        const res = await saveStateToFirebase();
        closeModal(); renderPts();
        showToast(res.ok ? 'PT adicionado!' : 'Erro ao guardar no Firebase', res.ok);
      });
    });
  });

  function renderAlunos(){
    const el = document.getElementById('alunos-list');
    if(state.alunos.length===0){ el.innerHTML = `<div class="empty-state">Sem alunos registados.</div>`; return; }
    el.innerHTML = state.alunos.map(a=>`
      <div class="card">
        <div class="card-row">
          <div><b>${a.nome}</b> (${a.sessoes}x/semana)</div>
          <button class="btn danger small" data-del-aluno="${a.id}">Remover</button>
        </div>
      </div>
    `).join('');
    el.querySelectorAll('[data-del-aluno]').forEach(b=>b.addEventListener('click', async ()=>{
      state.alunos = state.alunos.filter(a=>a.id!==b.dataset.delAluno);
      await saveStateToFirebase(); renderAlunos();
    }));
  }

  document.getElementById('btn-add-aluno').addEventListener('click', ()=>{
    openModal(`
      <h3>Novo Aluno</h3>
      <div class="field"><label>Nome</label><input type="text" id="m-nome"></div>
      <div class="field"><label>Sessões por semana</label><input type="number" id="m-sess" value="2"></div>
      <div class="modal-actions">
        <button class="btn secondary small" id="m-cancel">Cancelar</button>
        <button class="btn small" id="m-save">Guardar</button>
      </div>
    `, (root)=>{
      root.querySelector('#m-cancel').addEventListener('click', closeModal);
      root.querySelector('#m-save').addEventListener('click', async ()=>{
        const nome = root.querySelector('#m-nome').value.trim();
        if(!nome) return;
        state.alunos.push({ id: uid(), nome, sessoes: Number(root.querySelector('#m-sess').value)||1 });
        const res = await saveStateToFirebase();
        closeModal(); renderAlunos();
        showToast(res.ok ? 'Aluno adicionado!' : 'Erro ao guardar no Firebase', res.ok);
      });
    });
  });
</script>
</body>
</html>
